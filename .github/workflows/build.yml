name: build-windows
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V=$(python -c "import trader;print(trader.__version__)"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"

      - name: Stamp version into the package
        shell: bash
        run: |
          sed -i "s/^__version__ = .*/__version__ = \"${{ steps.ver.outputs.version }}\"/" trader/__init__.py
          sed -i "s#^UPDATE_REPO = .*#UPDATE_REPO = \"${GITHUB_REPOSITORY}\"#" trader/__init__.py
          cat trader/__init__.py

      - name: Run tests
        run: python -m pytest -q tests

      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name TGTrader
          --add-data "trader\knowledge\seed;trader\knowledge\seed"
          --collect-all ccxt --collect-submodules trader
          --hidden-import PySide6.QtSvg --hidden-import pyautogui --hidden-import mss --hidden-import PIL
          run.py

      - name: Smoke test the build
        shell: bash
        run: |
          ls dist/TGTrader | head
          test -f dist/TGTrader/TGTrader.exe

      - name: Inno Setup installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} scripts\installer.iss
          dir dist

      - name: Zip portable build
        run: Compress-Archive -Path dist\TGTrader\* -DestinationPath dist\TGTrader-portable-${{ steps.ver.outputs.version }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TGTrader-${{ steps.ver.outputs.version }}
          path: |
            dist/TGTrader-Setup.exe
            dist/TGTrader-portable-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TGTrader-Setup.exe
            dist/TGTrader-portable-*.zip
          generate_release_notes: true
